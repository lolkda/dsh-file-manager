name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite fails without the compiled helper, and the tarball is only
      # installable when it ships one, so the helper is built before any test.
      - name: Build the atomic rename helper
        run: npm run build:native

      - name: Type-check, build and syntax-check the shipped artifacts
        run: npm run check

      # The Client half is only ever loaded as the wrapped browser module the
      # harness reads verbatim, so its identity is asserted against package.json
      # rather than trusted to the bundler.
      - name: Assert the built Client module registers the package identity
        run: |
          set -euo pipefail
          name=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; process.stdout.write(JSON.parse(readFileSync('package.json','utf8')).name)")
          grep -q "__ModuleLoader__.load({" dist/client.js || { echo "::error::dist/client.js is not a ModuleLoader module"; exit 1; }
          grep -q "id: \"$name\"" dist/client.js || { echo "::error::dist/client.js does not register $name"; exit 1; }

      # Two suites drive a real deployed DSH. Install one so they execute here
      # rather than reporting the skip they use on a machine that has none. The
      # version is the one this release is adapted to: the 0.1.7-rc.1 settings
      # surface is what `tests/host-config.test.mjs` proves, so an older runtime
      # would either skip that evidence or make it meaningless.
      - name: Install the DSH runtime the integration suites resolve
        env:
          DSH_RUNTIME_VERSION: 0.1.7-rc.1
        run: |
          npm install --global "@deepseek-ai/dsh@${DSH_RUNTIME_VERSION}"
          root="$(npm root -g)/@deepseek-ai/dsh"
          echo "FILE_MANAGER_DSH_RUNTIME_ROOT=${root}" >> "$GITHUB_ENV"
          # The 0.1.7-specific evidence case reads its own variable and skips when it
          # is unset, so both names have to point at this installation.
          echo "FILE_MANAGER_DSH_017_RUNTIME_ROOT=${root}" >> "$GITHUB_ENV"

      # Without this, a failed or misplaced install would let those suites skip
      # silently and still leave the build green.
      - name: Assert the integration suites can resolve the DSH runtime
        run: |
          set -euo pipefail
          for variable in FILE_MANAGER_DSH_RUNTIME_ROOT FILE_MANAGER_DSH_017_RUNTIME_ROOT; do
            test -f "${!variable}/package.json" || {
              echo "::error::no DSH runtime at ${!variable} (${variable}); the integration suites would skip instead of running"
              exit 1
            }
          done

      - name: Test
        run: npm test

      - name: Pack the npm package
        run: npm pack

      - name: Assert the tarball carries every runtime entrypoint
        run: |
          set -euo pipefail
          tarball=$(ls -1 ./*.tgz | head -n 1)
          echo "Packing $tarball"
          listing=$(tar -tzf "$tarball")
          for required in \
            package/dist/index.js \
            package/dist/client.js \
            package/dist/host/scheduler.js \
            package/cordis.patch.yml \
            package/THIRD-PARTY-NOTICES.md \
            package/host/native/rename-no-replace
          do
            grep -qx "$required" <<<"$listing" \
              || { echo "::error::$tarball is missing $required"; exit 1; }
          done
          echo "Verified $(grep -c . <<<"$listing") packed entries"

      # Best effort only: GitHub Actions artifact storage is quota-limited, and a
      # quota-exhausted account must not make every run red. The pack and
      # assertion steps above are the real gate; this step just publishes the
      # verified tarball when the account has room for it.
      - name: Upload the package
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error