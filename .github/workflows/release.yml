name: Release

# Publishing is driven by a version tag, so the tag, package.json and the wire
# version are checked before anything reaches the registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.agreement.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the tag and package.json to agree with the built entrypoint
        id: agreement
        run: |
          set -euo pipefail
          version=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; process.stdout.write(JSON.parse(readFileSync('package.json', 'utf8')).version)")
          npm ci
          npm run build
          wire=$(node --input-type=module -e "const m = await import('./dist/index.js'); process.stdout.write(String(m.VERSION))")
          echo "package.json: $version"
          echo "dist/index.js: $wire"
          if [ "$version" != "$wire" ]; then
            echo "::error::the built Host entry reports version $wire, which disagrees with package.json ($version)"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: verify-version
    # A manual run on a branch verifies the release without publishing it.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm publish` runs prepublishOnly (check, build:native, test); two of
      # those suites need a real DSH, so install one and prove it resolves.
      - name: Install the DSH runtime the integration suites resolve
        env:
          DSH_RUNTIME_VERSION: 0.1.6-alpha.2
        run: |
          npm install --global "@deepseek-ai/dsh@${DSH_RUNTIME_VERSION}"
          echo "FILE_MANAGER_DSH_RUNTIME_ROOT=$(npm root -g)/@deepseek-ai/dsh" >> "$GITHUB_ENV"

      - name: Assert the integration suites can resolve the DSH runtime
        run: |
          set -euo pipefail
          test -f "${FILE_MANAGER_DSH_RUNTIME_ROOT}/package.json" || {
            echo "::error::no DSH runtime at ${FILE_MANAGER_DSH_RUNTIME_ROOT}; refusing to publish behind a silently weakened gate"
            exit 1
          }

      # `npm publish` runs prepublishOnly (check, build:native, test), so an
      # unverifiable build cannot reach the registry.
      - name: Detect npm credentials
        id: credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::NPM_TOKEN is not configured for this repository, so v${{ needs.verify-version.outputs.version }} was verified but not published."
          fi

      - name: Publish @lolkda/dsh-file-manager
        if: steps.credentials.outputs.available == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}